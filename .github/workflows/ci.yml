name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint production code
        run: ruff check app.py apps/rag_api.py rag_runtime tests scripts/load_test.py scripts/verify_runtime_artifacts.py

      - name: Check frontend syntax
        run: node --check frontend/app.js

      - name: Verify frozen runtime artifacts
        run: python scripts/verify_runtime_artifacts.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -p "test_*.py" -q

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt --strict

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag civicguide-ai:ci .

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --publish 8000:8000 civicguide-ai:ci)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready --output health.json; then
              python -c 'import json; value=json.load(open("health.json")); assert value["status"] == "ready" and value["chunks"] == 1273'
              exit 0
            fi
            sleep 2
          done
          exit 1
